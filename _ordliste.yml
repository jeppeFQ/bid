# Ordliste for hele kurset — ÉN linje pr. ord:   ord: "forklaring på én linje"
# Brug i slides:  [algoritme]{.ord}   eller med anden ordlyd:  [algoritmen]{.ord ord="algoritme"}
# Store og små bogstaver er ligegyldige. Hold forklaringen kort: den vises ved hover og fokus.
algoritme: "En præcis, endelig række trin, der løser et problem. Samme input giver altid samme output."
variabel: "Et navn, I sætter på en værdi, så maskinen kan gemme den, og I kan hente den frem igen."
funktion: "En navngiven opskrift: tager noget ind (argumenter), gør noget og giver et resultat tilbage."
argument: "Det, I giver en funktion i parentesen, fx tallet 2 i round(3.14159, 2)."
metode: "En funktion, der hører til et objekt og kaldes med punktum: objekt.metode()."
type: "Det, en værdi er: fx heltal (int), kommatal (float) eller tekst (str). Typen afgør, hvad man kan gøre med værdien."
løkke: "Kode, der gentager de samme linjer for hvert element, ét ad gangen (for ... in ...)."
boolean: "En logisk værdi, der kun kan være True eller False. Svaret på et ja/nej-spørgsmål."
objekt: "En værdi sammen med de ting, den kan gøre. I Python er næsten alt et objekt."
bibliotek: "En samling færdige funktioner, som andre har skrevet. Hentes med import."
notebook: "Et dokument, hvor tekst og kørbar kode står side om side i celler."
fortolker: "Et program, der oversætter og udfører koden undervejs, linje for linje."
compiler: "Et program, der oversætter et helt program fra et sprog til et andet, før det kører."
repository: "En mappe med alle filer og hele versionshistorikken for et projekt. Lokalt eller på en server som GitHub."
commit: "Et øjebliksbillede af projektet med en unik hash, en forfatter, et tidspunkt og en besked."
branch: "En parallel udviklingslinje, hvor man kan arbejde uden at røre hovedkoden."
merge: "At flette ændringerne fra én branch ind i en anden."
fork: "Jeres egen kopi af en andens repository, på serveren (fx GitHub)."
pull request: "En anmodning til ejeren af et repository om at trække jeres ændringer ind."
abstraktion: "At smide alt det væk, der ikke betyder noget for opgaven, og beholde det, der gør."
grænseflade: "Det, man skal vide for at bruge noget: hvad det får, og hvad det giver. Ikke hvordan det gør det."
docstring: "Teksten mellem tre anførselstegn øverst i en funktion, der forklarer, hvad den gør."
klasse: "En skabelon for objekter: hvad de ved (attributter), og hvad de kan (metoder)."
attribut: "En værdi, der hører til et objekt, fx skolen.ansatte."
fremmednøgle: "En kolonne, der skal pege på en række, der findes i en anden tabel."
join: "At sætte to tabeller sammen på en fælles kolonne. Det samme som merge i pandas."
API: "En kontrakt, der bestemmer, hvordan to programmer taler sammen."
JSON: "Et tekstformat til data, der ligner en Python-ordbog. Sådan rejser data over nettet."
markup: "Tegn i teksten, der fortæller noget om teksten: at noget er en overskrift, fed eller et link."
token: "Den enhed, en sprogmodel ser: et ord eller en del af et ord, gemt som et tal."
